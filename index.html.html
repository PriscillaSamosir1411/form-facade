<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form with Timer</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #timer {
        font-size: 18px;
        font-weight: bold;
        color: red;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Form with Timer</h1>
    <div id="timer">Time left: 5:00</div>
    <div id="ff-compose"></div>
<script async defer src="https://formfacade.com/include/101680789596254512831/form/1FAIpQLSeWAGzXlXpnmPSsExfILDKZDQ5Rvc3E8qx7VPmnWFXdeQd1hQ/classic.js?div=ff-compose"></script>
    <script>
      let timeLeft = 300; // Waktu dalam detik (5 menit)
      const timerDisplay = document.getElementById("timer");

      const countdown = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `Time left: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(countdown);
          alert("Time is up! Your form will be submitted.");

          // Otomatis kirim form jika waktu habis
          const iframe = document.getElementById("ff-compose");
          iframe.scrollIntoView(); // Pastikan form terlihat
          iframe.contentWindow.postMessage({ type: "submit" }, "*");
        }
      }, 1000);

      // Feedback setelah form dikirim
      window.addEventListener("message", (event) => {
        if (event.data.type === "submitted") {
          alert("Thank you for your submission! We have received your response.");
          // Tambahkan aksi lain, misalnya sembunyikan form
          document.getElementById("ff-compose").style.display = "none";
          document.getElementById("timer").style.display = "none";
        }
      });
    </script>
  </body>
</html>
